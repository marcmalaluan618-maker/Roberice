<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Available Inventory - Roberice POS & Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <main class="main-wrapper">
      <div class="page-container">
        
        <div class="page-header">
          <div class="page-title">
            <h2>Available Inventory</h2>
            <p>Read-only current stock levels of all rice varieties in sacks and kilograms.</p>
          </div>
        </div>

        <div class="card">
          <!-- Filter Controls -->
          <div class="filter-bar">
            <div class="search-box">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input type="text" id="searchInventory" class="form-control" placeholder="Search by variety name or category...">
            </div>

            <div class="filter-actions">
              <select id="filterStatus" class="form-select" style="width: 160px;">
                <option value="all">All Statuses</option>
                <option value="instock">In Stock</option>
                <option value="lowstock">Low Stock</option>
                <option value="outofstock">Out of Stock</option>
              </select>
            </div>
          </div>

          <!-- Inventory Table -->
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Rice Variety</th>
                  <th>Category</th>
                  <th>Sack Price</th>
                  <th>Kg Price</th>
                  <th>Sacks Left</th>
                  <th>Kg Left</th>
                  <th>Formatted Stock</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody">
                <!-- Rendered via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/view-inventory.js"></script>
</body>
</html>
